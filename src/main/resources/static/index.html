<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse clips - Animation Workbench Community</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main>
    <h1>Community clips</h1>
    <p class="lead">Humanoid animations made in the Animation Workbench, shared under CC BY 4.0.</p>
    <form class="filters" id="filters">
      <div class="segmented" id="sort" role="group" aria-label="Sort"></div>
      <input type="search" name="q" placeholder="Search titles, descriptions, tags" aria-label="Search">
      <button class="primary" type="submit">Search</button>
    </form>
    <div id="results" class="grid"></div>
    <div id="state"></div>
    <div class="pager" id="pager"></div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="/assets/app.js"></script>
  <script src="/assets/viewer.js"></script>
  <script src="/assets/pages/browse.js"></script>
</body>
</html>
