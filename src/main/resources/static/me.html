<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My clips - Animation Workbench Community</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main>
    <h1>My clips</h1>
    <p class="lead">Share clips from the Animation Workbench: right-click a clip, Export Clip, Share as .awclip.</p>
    <div id="state"></div>
    <h2>Notifications</h2>
    <div id="notifications"></div>
    <h2>Clips</h2>
    <table class="list" id="clips"><thead><tr><th>Title</th><th>Status</th><th>Version</th><th>Downloads</th><th></th></tr></thead><tbody></tbody></table>
    <h2>Workbench sign-ins</h2>
    <p class="muted small">Signed in on a computer you no longer use? End every Workbench sign-in of this account.</p>
    <button id="revoke" class="danger">Sign out all Workbench installations</button>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="/assets/app.js"></script>
  <script src="/assets/pages/me.js"></script>
</body>
</html>
