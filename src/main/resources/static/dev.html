<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Developer sign-in - Animation Workbench Community</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main>
    <div class="panel prose">
      <h1>Developer sign-in</h1>
      <p class="lead">Only available when the server runs with <code>portal.dev-login=true</code>.</p>
      <form id="dev-form" class="filters"><input name="name" placeholder="name" required><button class="primary">Sign in</button></form>
      <div id="state"></div>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="/assets/app.js"></script>
  <script src="/assets/pages/dev.js"></script>
</body>
</html>
