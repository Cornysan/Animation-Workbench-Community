<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('Clip')}"></head>
<body th:attr="data-signed-in=${user != null}">
<header th:replace="~{fragments/shell :: header}"></header>
<main>
  <div th:replace="~{fragments/shell :: paused}"></div>
  <div id="state"></div>
  <div id="clip" class="clip-layout hidden">
    <section>
      <div class="viewer" id="viewer"></div>
      <h2>About</h2>
      <p id="description" class="muted"></p>
    </section>
    <aside class="panel">
      <h1 id="title"></h1>
      <div class="muted small">by <span id="author"></span></div>
      <div class="tags" id="tags"></div>
      <dl class="facts" id="facts"></dl>
      <div id="license" class="notice"></div>
      <div class="actions" id="actions"></div>
      <div id="action-state"></div>
    </aside>
  </div>
  <dialog id="report-dialog">
    <form method="dialog" id="report-form">
      <h2>Report this clip</h2>
      <p class="muted small">The clip is hidden right away while a moderator looks at it. Please only report real problems.</p>
      <label class="field"><span>Reason</span>
        <select name="category">
          <option value="COPYRIGHT">It is someone else's work</option>
          <option value="INAPPROPRIATE">Inappropriate content</option>
          <option value="BROKEN">Broken or not what it says</option>
          <option value="OTHER">Something else</option>
        </select>
      </label>
      <label class="field"><span>Details (optional)</span><textarea name="message" maxlength="2000"></textarea></label>
      <div class="actions"><button class="danger" value="send">Report</button><button value="cancel">Cancel</button></div>
    </form>
  </dialog>
  </main>
<footer th:replace="~{fragments/shell :: footer}"></footer>
<script src="/assets/app.js"></script>
<script src="/assets/viewer.js"></script>
<script src="/assets/pages/clip.js"></script>
<script type="module" src="/assets/pages/clip-viewer.js"></script>
</body>
</html>
