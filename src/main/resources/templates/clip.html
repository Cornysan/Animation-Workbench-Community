<!doctype html>
<!--
  Die Seite einer Animation.

  AUFBAU WIE BEI EINEM VIDEO: die Bewegung zuerst, darunter ihr Name, wer sie
  gemacht hat und was man mit ihr tun kann - und darunter das Gespraech. Der
  Titel stand vorher in der rechten Spalte, neben der Buehne statt unter ihr;
  das las sich als Beschriftung eines Kastens, nicht als Name der Sache.

  RECHTS STEHT, WAS MAN MITNIMMT: der Knopf, die Zahlen. Die Spalte klebt
  beim Scrollen, damit der Weg ins eigene Projekt nie aus dem Bild geht. Die
  Lizenz stand hier als Kasten ueber dem Knopf - sie ist fuer jeden
  oeffentlichen Clip dieselbe und steht unter "Licenses" im Fuss.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('Clip')}"></head>
<body th:attr="data-signed-in=${user != null}">
<!--
  DIE BUEHNE HAENGT AN EINER KETTE: clip-viewer.js -> viewer-ui.js -> stage.js
  -> three.js -> Mannequin, und jedes Glied entdeckt der Browser erst, wenn das
  vorige angekommen ist. Hier fordert er alle zugleich an, dazu die Vorschau
  selbst, deren Adresse der Server schon kennt. `crossorigin` bei den
  fetch-Vorab-Anfragen, weil fetch() und GLTFLoader im CORS-Modus holen - ohne
  passenden Modus laege die Vorab-Antwort ungenutzt daneben.
-->
<link rel="modulepreload" th:href="|${@buildStamp.assets}/viewer-ui.js|">
<link rel="modulepreload" th:href="|${@buildStamp.assets}/figures.js|">
<link rel="modulepreload" th:href="|${@buildStamp.assets}/stage.js|">
<link rel="modulepreload" th:href="|${@buildStamp.assets}/vendor/three.module.js|">
<link rel="preload" as="fetch" crossorigin th:if="${clipSlug != null}"
      th:href="@{/api/v1/packages/{s}/preview(s=${clipSlug})}">
<link rel="preload" as="fetch" crossorigin th:if="${clipRig != 'generic'}"
      th:href="|${@buildStamp.assets}/models/aw-mannequin.glb|">
<header th:replace="~{fragments/shell :: header}"></header>
<main id="main" class="wide">
  <div th:replace="~{fragments/shell :: paused}"></div>
  <div id="state"></div>

  <div id="clip" class="clip-layout hidden">
    <section class="clip-main">
      <div class="viewer" id="viewer" th:attr="data-rig=${clipRig}"></div>

      <h1 id="title"></h1>
      <div class="clip-byline">
        <span class="avatar" id="author-initial">?</span>
        <div>
          <div id="author" class="clip-author"></div>
          <div class="faint small" id="clip-sub"></div>
        </div>
        <div class="clip-actions" id="clip-actions"></div>
      </div>
      <div id="action-state"></div>

      <div class="tags" id="tags"></div>
      <p id="description" class="clip-description"></p>

      <!-- E10: unter jeder Animation steht ein Gespraech. Flach, ohne Antworten
           auf Antworten - die Endpunkte gibt es seit dem 20.09., im Web fehlte
           bis hierher nur die Oberflaeche dazu. -->
      <section class="comments" id="comments" hidden>
        <h2 id="comments-title">Comments</h2>
        <div id="comment-form"></div>
        <div id="comment-list" class="comment-list"></div>
        <div id="comment-state"></div>
      </section>
    </section>

    <aside class="clip-side">
      <div class="panel get-panel">
        <!--
          HIER STAND EINE UNITY-WEGBESCHREIBUNG ("Tools > Animation Workbench
          > Community"). Der Pfad stimmt sogar - er ist nur nicht die Sache
          dieser Seite. Wer hier ist, browst und laedt herunter; wer in Unity
          sitzt, hat den Katalog dort im Fenster und braucht keine Anleitung
          von aussen. Was diese Seite anbietet, steht in den Knoepfen.
        -->

        <!--
          Der Download-Knopf mit der Formatwahl dahinter - gefuellt von
          `clip-download.js`. Formate, die die Buehne brauchen ("mit Figur"
          schreibt genau die Pose heraus, die sie zeigt), sagen selbst, wenn
          sie gerade nicht gehen.
        -->
        <div id="downloads"></div>
      </div>

      <dl class="facts" id="facts"></dl>

      <div class="related" id="related" hidden>
        <h2 id="related-title">More like this</h2>
        <div class="related-list" id="related-list"></div>
      </div>
    </aside>
  </div>

  <dialog id="report-dialog">
    <form method="dialog" id="report-form">
      <h2>Report this clip</h2>
      <p class="muted small">The clip is hidden right away while a moderator looks at it. Please only report real problems.</p>
      <label class="field"><span>Reason</span>
        <select name="category">
          <option value="COPYRIGHT">It is someone else's work</option>
          <option value="INAPPROPRIATE">Inappropriate content</option>
          <option value="BROKEN">Broken or not what it says</option>
          <option value="OTHER">Something else</option>
        </select>
      </label>
      <label class="field"><span>Details (optional)</span><textarea name="message" maxlength="2000"></textarea></label>
      <div class="actions"><button class="danger" value="send">Report</button><button value="cancel">Cancel</button></div>
    </form>
  </dialog>
</main>
<footer th:replace="~{fragments/shell :: footer}"></footer>
<script th:src="|${@buildStamp.assets}/app.js|"></script>
<script th:src="|${@buildStamp.assets}/viewer.js|"></script>
<script th:src="|${@buildStamp.assets}/pages/clip.js|"></script>
<script th:src="|${@buildStamp.assets}/pages/clip-comments.js|"></script>
<script type="module" th:src="|${@buildStamp.assets}/pages/clip-viewer.js|"></script>
<script type="module" th:src="|${@buildStamp.assets}/pages/clip-download.js|"></script>
</body>
</html>
