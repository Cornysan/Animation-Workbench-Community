<!doctype html>
<!--
  Eine Sammlung.

  Derselbe Aufbau wie der Katalog - Kopf, dann Kachelwand -, weil eine
  Sammlung nichts anderes ist als ein Katalog, den ein Mensch ausgesucht hat.
  Wer sie besitzt, findet seine Handgriffe im Kopf; wer sie nur ansieht, sieht
  dort nur den Link zum Kopieren.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('Collection')}"></head>
<body th:attr="data-signed-in=${user != null}">
<header th:replace="~{fragments/shell :: header}"></header>
<main class="wide">
  <div th:replace="~{fragments/shell :: paused}"></div>
  <div id="state"></div>

  <div id="collection" class="hidden">
    <section class="collection-head">
      <div class="collection-copy">
        <h1 id="title"></h1>
        <div class="faint small" id="sub"></div>
        <p id="description" hidden></p>
      </div>
      <div class="collection-actions" id="actions"></div>
    </section>

    <div id="action-state"></div>
    <div id="results" class="grid"></div>
    <div id="empty"></div>
  </div>
</main>
<footer th:replace="~{fragments/shell :: footer}"></footer>
<script src="/assets/app.js"></script>
<script src="/assets/viewer.js"></script>
<script src="/assets/pages/collection.js"></script>
</body>
</html>
