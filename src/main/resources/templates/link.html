<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('Connect the Workbench')}"></head>
<body th:attr="data-signed-in=${user != null},data-discord-sign-in=${discordSignIn},data-dev-login=${devLogin}">
<header th:replace="~{fragments/shell :: header}"></header>
<main id="main">
  <div th:replace="~{fragments/shell :: paused}"></div>
  <div class="panel prose">
    <h1>Connect the Animation Workbench</h1>
    <p class="lead">Confirm that the code below is the one shown in your Unity editor.</p>
    <div class="code-display" id="code">-</div>
    <div id="state"></div>
    <div class="actions" id="actions"></div>
  </div>
  </main>
<footer th:replace="~{fragments/shell :: footer}"></footer>
<script th:src="|${@buildStamp.assets}/app.js|"></script>
<script th:src="|${@buildStamp.assets}/pages/link.js|"></script>
</body>
</html>
