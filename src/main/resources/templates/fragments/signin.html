<!doctype html>
<!--
  Die Zeichen der Anbieter, fuer die Anmeldeseite und die Kontoseite.

  Sie stehen als Markup in einer Vorlage und NICHT im Zeichenvorrat von app.js:
  dort ist alles einfarbiger Strich, und Googles G darf nur in seinen vier
  Farben erscheinen. Ausserdem entsteht jede Stelle, die sie braucht, ohnehin
  auf dem Server - kein Skript muss sie bauen, also braucht auch keins eine
  Trusted-Types-Erlaubnis dafuer.

  Farben stehen als `fill`-Attribut, nicht als `style`: die Content Security
  Policy laesst keine Inline-Stile zu, Praesentationsattribute schon.
-->
