<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('Developer sign-in')}"></head>
<body th:attr="data-signed-in=${user != null}">
<header th:replace="~{fragments/shell :: header}"></header>
<main id="main">
  <div th:replace="~{fragments/shell :: paused}"></div>
  <div class="panel prose">
    <h1>Developer sign-in</h1>
    <p class="lead">Only available when the server runs with <code>portal.dev-login=true</code>.</p>
    <form id="dev-form" class="filters"><input name="name" placeholder="name" required><button class="primary">Sign in</button></form>
    <div id="state"></div>
  </div>
  </main>
<footer th:replace="~{fragments/shell :: footer}"></footer>
<script th:src="|${@buildStamp.assets}/app.js|"></script>
<script th:src="|${@buildStamp.assets}/pages/dev.js|"></script>
</body>
</html>
