name: CI/CD

# -------------------------------------------------------------------
# Trigger:
# - Pushes auf Feature-/Test-/Develop-Branches
# - Pull Requests nach main oder develop
# → main wird bewusst NICHT direkt deployed
# Ausgerollt wird von Hand, siehe server/DEPLOY.md:
#   ssh linux 'cd /srv/aw-community && docker compose pull && docker compose up -d'
# -------------------------------------------------------------------
on:
  push:
    branches:
      - '**'

# -------------------------------------------------------------------
# Zentrale Image-Definition
# -------------------------------------------------------------------
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cornysan/animation-workbench-community

jobs:
  # ===================================================================
  # 1. Build & Test
  # - Läuft immer
  # - Baut JAR
  # - Führt Tests aus
  # - Liefert Feedback für PRs
  # ===================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write        # Test Reports in GitHub UI
      pull-requests: write # PR-Kommentare

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Einheitliche Java-Version für lokale & CI Builds
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Baut das Projekt (inkl. Compile + Check)
      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      # Führt Tests separat aus (klareres Feedback)
#      - name: Run tests
#        run: ./gradlew test --no-daemon

      # Stellt Testergebnisse im GitHub UI dar
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: build/test-results/test/*.xml
          reporter: java-junit
          fail-on-error: false

  # ===================================================================
  # 2. Docker Build & Push
  # - Nur bei PUSH (nicht bei PRs)
  # - Baut deploybares Artefakt
  # - Kein Server-Zugriff
  # ===================================================================
  docker-build-push:
    name: Docker Build & Push
    needs: build-and-test
    runs-on: ubuntu-latest

    # Verhindert Image-Builds für Pull Requests
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------
      # Tag-Strategie:
      # - branch-name        (nur für Tests)
      # - branch-sha-<hash>  (eindeutig & rollbackfähig)
      #
      # Branch triggert Build
      # SHA identifiziert das Artefakt
      # ----------------------------------------------------------------
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BUILD_NUMBER=${{ github.run_number }}
            BUILD_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Rein informativ – kein Deployment in diesem Schritt
      - name: Image info
        run: |
          echo "### 🐳 Docker Image Built (Test)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** No automatic deployment happens here." >> $GITHUB_STEP_SUMMARY

  # ===================================================================
  # 3. Zusammenfassung
  # - Rein visuell
  # - Keine Logik
  # ===================================================================
  summary:
    name: Test Summary
    needs: [build-and-test, docker-build-push]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "### CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
