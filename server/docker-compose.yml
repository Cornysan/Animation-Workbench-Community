###############################################################################
# Animation Workbench Community Portal - Docker Compose (Produktion)
#
#   Internet
#     |
#   Caddy auf dem Host (Port 80/443, TLS, laeuft dort schon fuer docs./feedback.)
#     |
#   Portal (127.0.0.1:8090, nicht von aussen erreichbar)
#     |
#   PostgreSQL (nur im Docker-Netz)
#
# Kein eigenes nginx und kein certbot: der Server hat seit der Doku-Site Caddy
# auf 80/443. Ein zweiter Dienst auf denselben Ports haette docs.playmations.com
# mit heruntergerissen. Der Caddy-Block liegt in server/caddy/.
#
# Auf dem Server liegen:
#   /srv/aw-community        docker-compose.yml + .env
#   Daten in benannten Volumes (siehe unten), Sicherung per server/backup.sh
#
# Kein Git auf dem Server. Images kommen aus der CI:
#   TAG=main-<sha> docker compose up -d     # eine bestimmte Fassung
#   docker compose pull && docker compose up -d
###############################################################################

# Fester Projektname: sonst heissen die Volumes nach dem Ordner, in dem
# jemand zufaellig steht, und das Backup greift ins Leere.
name: aw-community

services:

  ###########################################################################
  # PostgreSQL
  ###########################################################################
  postgres:
    image: postgres:18-alpine
    container_name: aw_community_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: awcommunity
      POSTGRES_USER: awcommunity
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in .env}

    volumes:
      # Ab postgres:18 gehoert der Mount an /var/lib/postgresql, NICHT an
      # .../data: das Image legt die Daten in ein Unterverzeichnis je
      # Hauptversion, damit `pg_upgrade --link` nicht ueber eine Mount-Grenze
      # stolpert. Liegt der Mount am alten Platz, startet der Container gar
      # nicht erst und erklaert das in zwanzig Zeilen Fliesstext.
      - postgres_data:/var/lib/postgresql

    networks:
      - aw-community

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awcommunity"]
      interval: 10s
      timeout: 5s
      retries: 5

    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  ###########################################################################
  # Portal - Spring Boot, bindet NUR an 127.0.0.1
  ###########################################################################
  portal:
    image: ghcr.io/cornysan/animation-workbench-community:${TAG:-main}
    container_name: aw_community
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    # Nur der Host kommt dran, und der Host ist Caddy. Ohne die 127.0.0.1
    # davor macht Docker den Port an der oeffentlichen IP auf - an der
    # Firewall vorbei, weil Docker seine Regeln vor UFW einhaengt.
    ports:
      - "127.0.0.1:8090:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/awcommunity
      SPRING_DATASOURCE_USERNAME: awcommunity
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in .env}

      # Der Container hat 1,5 GB; ohne das nimmt die JVM ein Viertel des
      # HOST-Speichers als Anhaltspunkt und liegt daneben.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70

      PORTAL_BASE_URL: ${PORTAL_BASE_URL:?PORTAL_BASE_URL fehlt in .env}
      PORTAL_STORAGE_DIR: /var/lib/aw-community/blobs
      PORTAL_DOWNLOAD_SECRET: ${PORTAL_DOWNLOAD_SECRET:?PORTAL_DOWNLOAD_SECRET fehlt in .env}
      PORTAL_PSEUDONYM_SECRET: ${PORTAL_PSEUDONYM_SECRET:?PORTAL_PSEUDONYM_SECRET fehlt in .env}
      PORTAL_ADMIN_DISCORD_IDS: ${PORTAL_ADMIN_DISCORD_IDS:-}
      # true = Suchmaschinen duerfen die Seite listen (robots.txt, Sitemap).
      PORTAL_SEARCH_INDEXING: ${PORTAL_SEARCH_INDEXING:-false}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID fehlt in .env}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET fehlt in .env}
      # Freiwillig. "unset" statt leer: eine LEERE Client-ID laesst Spring Boot
      # beim Start abbrechen, "unset" heisst "nicht anbieten" (SignInProviders).
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-unset}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-unset}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-unset}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-unset}
      PORTAL_ALERT_WEBHOOK: ${PORTAL_ALERT_WEBHOOK:-}
      PORTAL_ALERT_MAIL_TO: ${PORTAL_ALERT_MAIL_TO:-}
      PORTAL_ALERT_MAIL_FROM: ${PORTAL_ALERT_MAIL_FROM:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}

    volumes:
      - blob_data:/var/lib/aw-community/blobs

    mem_limit: 1500m

    networks:
      - aw-community

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging: *logging

networks:
  aw-community:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  # Hochgeladene .awclip-Dateien und Vorschauen. In die Sicherung aufnehmen -
  # die Datenbank allein reicht nicht, sie kennt nur die Namen.
  blob_data:
    driver: local
