# ---------------------------------------------------------------------
# Nginx Main Configuration
#
# Diese Datei:
# - definiert globale Nginx-Settings
# - lädt KEINE Domains direkt
# - inkludiert alle Virtual Hosts aus conf.d/
#
# Domains, SSL, Reverse Proxy etc. gehören ausschließlich nach:
#   /etc/nginx/conf.d/*.conf
#
# (Host-Pfad: /var/lib/motionlabs/nginx/conf.d)
# ---------------------------------------------------------------------

user nginx;
worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # -------------------------------------------------------------
    # Basis-Typen & Defaults
    # -------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    # -------------------------------------------------------------
    # Performance / Netzwerk
    # -------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # -------------------------------------------------------------
    # Limits
    # -------------------------------------------------------------
    client_max_body_size 100M;

    # -------------------------------------------------------------
    # Gzip (optional, aber sinnvoll für APIs)
    # -------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        text/xml
        image/svg+xml;

    # -------------------------------------------------------------
    # Virtual Hosts
    # -------------------------------------------------------------
    # Hier werden alle Domains, SSL-Setups und Reverse-Proxies geladen
    include /etc/nginx/conf.d/*.conf;
}