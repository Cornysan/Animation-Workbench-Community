server {
    listen 80;
    server_name api.playmations.com;

    # ACME Challenge für Certbot
    location /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        try_files $uri =404;
    }

    # Alles andere ? HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}