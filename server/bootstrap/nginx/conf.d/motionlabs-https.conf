# ---------------------------------------------------------------------
# MotionLabs Backend  HTTPS Virtual Host
#
# Aufgabe:
# - TLS Terminierung (Let's Encrypt)
# - Reverse Proxy zum Spring Boot Backend
# - Sichere Default-Header
#
# Abhängigkeiten:
# - Zertifikate via Certbot unter /etc/letsencrypt
# - Backend erreichbar als Docker Service: backend:8080
# ---------------------------------------------------------------------

server {
    listen 443 ssl http2;
    server_name api.playmations.com;

    # -----------------------------------------------------------------
    # TLS / SSL
    # -----------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/api.playmations.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.playmations.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # -----------------------------------------------------------------
    # Security Headers (API-sicher, nicht zu aggressiv)
    # -----------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;

    # -----------------------------------------------------------------
    # Limits
    # -----------------------------------------------------------------
    # .awclip ist auf 8 MB begrenzt (AwclipSchema), Multipart braucht etwas Luft.
    client_max_body_size 10M;

    # -----------------------------------------------------------------
    # Reverse Proxy ? Spring Boot Backend
    # -----------------------------------------------------------------
    location / {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        # Forward original request info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket / SSE support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}